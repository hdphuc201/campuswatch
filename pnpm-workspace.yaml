packages:
  - apps/*
  - packages/*
  - tests/*

# Shared versions for dependencies used by more than one workspace package.
catalog:
  '@nestjs/common': 12.4.2
  '@nestjs/core': 12.4.2
  '@nestjs/cli': 12.0.12
  '@nestjs/testing': 12.4.2
  '@swc/core': 1.16.22
  '@types/node': 22.20.5
  eslint: 10.14.0
  prettier: 3.9.10
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  typescript: 6.0.3
  unplugin-swc: 2.0.0
  vitest: 5.1.0
  zod: 4.6.7

# Dependency install scripts are blocked by default; allow only the ones we need.
onlyBuiltDependencies:
  - '@swc/core'

ignoredBuiltDependencies:
  # drizzle-kit's esbuild runs from its platform binary package; its install check is not needed.
  - esbuild
  # Optional native speed-up for BullMQ's msgpackr; the pure JavaScript fallback is used.
  - msgpackr-extract
